<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>特教老師的 AI skills 裝備箱</title>
<meta name="description" content="特教老師做給教學現場的 AI 小幫手，複製一行指令貼給 AI 就能用。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
  /* 特工365 風格：方格筆記紙、書本綠橘、粗線卡片、螢光筆標籤、對話框 */
  :root{
    --paper:#fbf8ef; --grid:rgba(110,165,72,.10); --surface:#ffffff; --ink:#2a2a26; --muted:#66655c; --line:#2a2a26;
    --green:#5c8d3c; --leaf:#6ea548; --leaf-soft:#e8f3df; --orange:#f39801; --orange-deep:#d97e00; --orange-soft:#fff1d9;
    --hl-yellow:#fff07a; --hl-green:#c6edb4; --hl-blue:#c4e2ff; --hl-pink:#ffd0de;
    --shadow:4px 4px 0 rgba(42,42,38,.12);
    --font-hand:"LXGW WenKai TC","Noto Sans TC","Microsoft JhengHei",serif;
    --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Noto Sans TC",monospace;
  }
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
    --paper:#1b1d18; --grid:rgba(140,190,100,.08); --surface:#24271f; --ink:#ecebe3; --muted:#b0afa4; --line:#cfcdbf;
    --green:#9fd07a; --leaf:#8cc865; --leaf-soft:#2b3824; --orange:#ffb340; --orange-deep:#ffb340; --orange-soft:#3d2f17;
    --hl-yellow:#6b5f12; --hl-green:#2f5527; --hl-blue:#24476b; --hl-pink:#6a2e41; --shadow:4px 4px 0 rgba(0,0,0,.35); color-scheme:dark}}
  :root[data-theme="dark"]{
    --paper:#1b1d18; --grid:rgba(140,190,100,.08); --surface:#24271f; --ink:#ecebe3; --muted:#b0afa4; --line:#cfcdbf;
    --green:#9fd07a; --leaf:#8cc865; --leaf-soft:#2b3824; --orange:#ffb340; --orange-deep:#ffb340; --orange-soft:#3d2f17;
    --hl-yellow:#6b5f12; --hl-green:#2f5527; --hl-blue:#24476b; --hl-pink:#6a2e41; --shadow:4px 4px 0 rgba(0,0,0,.35); color-scheme:dark}

  *{box-sizing:border-box} [hidden]{display:none!important}
  body{margin:0;color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.75;
    background-color:var(--paper);
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:28px 28px}
  .wrap{max-width:1120px;margin:0 auto;padding:36px max(16px,env(safe-area-inset-right,0px)) 72px max(16px,env(safe-area-inset-left,0px));
    display:flex;flex-direction:column;gap:30px}
  .hl{white-space:nowrap;background:linear-gradient(transparent 52%,var(--hl-yellow) 52%,var(--hl-yellow) 92%,transparent 92%);padding:0 .1em}

  /* 頁首：書頁色帶 */
  header{display:grid;grid-template-columns:1fr;gap:20px;align-items:end}
  .brand{display:flex;align-items:center;gap:8px;font-family:var(--font-hand);font-weight:700;color:var(--green);font-size:17px}
  .brand{gap:16px}
  .brand img{width:clamp(56px,8vw,84px);height:clamp(56px,8vw,84px);flex:none;background:#fff;border-radius:50%;padding:3px}
  .brand h1{margin:0}
  h1{font-family:var(--font-hand);font-size:clamp(34px,5.6vw,54px);line-height:1.2;margin:6px 0 10px;font-weight:700;text-wrap:balance}
  .lead{margin:0;color:var(--muted);max-width:34em;font-size:17px}
  @media (max-width:720px){header{grid-template-columns:1fr}}

  /* 啟用三步驟：任務卡 */
  .mission{background:var(--surface);border:2px solid var(--line);border-radius:18px;box-shadow:var(--shadow);position:relative;padding:26px 24px 20px}
  .mission-tag{position:absolute;top:-16px;left:22px;background:var(--orange);color:#fff;font-family:var(--font-hand);font-weight:700;font-size:18px;
    padding:3px 16px;border-radius:8px;transform:rotate(-2deg);letter-spacing:.06em}
  .mission ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:0;counter-reset:s}
  .mission li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;padding:4px 18px;min-width:0}
  .mission li+li{border-left:2px dashed color-mix(in srgb,var(--line) 30%,transparent)}
  .mission li::before{content:counter(s);flex:none;width:40px;height:40px;border-radius:50%;border:2.5px solid var(--leaf);color:var(--green);
    display:grid;place-items:center;font-family:var(--font-hand);font-weight:700;font-size:22px;background:var(--leaf-soft)}
  .mission b{display:block;font-size:17px}
  .mission p{margin:2px 0 0;color:var(--muted);font-size:14px;line-height:1.6}
  @media (max-width:820px){.mission ol{grid-template-columns:1fr;gap:12px}.mission li{padding:0}.mission li+li{border-left:0}}

  /* 分類：書籤索引標籤 */
  .shelf{display:flex;flex-direction:column}
  .tabs{display:flex;flex-wrap:wrap;gap:6px;padding-left:12px}
  .tab{font:inherit;font-family:var(--font-hand);font-weight:700;font-size:17px;color:var(--ink);cursor:pointer;min-height:44px;
    padding:8px 18px 6px;border:2px solid var(--line);border-bottom:0;border-radius:12px 12px 0 0;background:var(--surface);opacity:.75;
    position:relative;top:2px;transition:opacity .15s,padding .15s}
  .tab .n{font-family:var(--font);font-weight:500;font-size:13px;color:var(--muted);margin-left:4px}
  .tab:hover{opacity:1}
  .tab[aria-pressed="true"]{opacity:1;background:var(--tab,var(--hl-yellow));padding-top:12px;z-index:1}
  .tab:focus-visible,.copy:focus-visible,.gh:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
  .board{border:2px solid var(--line);border-radius:18px;background:color-mix(in srgb,var(--surface) 55%,transparent);padding:24px;
    display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
  @media (max-width:820px){.board{grid-template-columns:1fr;padding:14px;gap:16px}}

  /* 卡片 */
  .card{background:var(--surface);border:2px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:22px 22px 18px;
    display:flex;flex-direction:column;gap:14px;min-width:0}
  .card-top{display:flex;gap:16px;align-items:center}
  .icon{flex:none;width:62px;height:62px;border-radius:50%;border:3px solid var(--c);color:var(--c);display:grid;place-items:center;background:var(--surface)}
  .icon svg{width:30px;height:30px}
  .label{display:inline-block;font-size:13px;font-weight:700;padding:1px 10px;border-radius:4px;background:var(--tab);transform:rotate(-1.5deg)}
  .card h2{font-family:var(--font-hand);font-size:24px;line-height:1.3;margin:4px 0 0;font-weight:700}
  .summary{margin:0;color:var(--muted);font-size:15px;line-height:1.75;flex:1}
  .say{position:relative;border:2px solid var(--line);border-radius:14px;padding:10px 14px 10px 14px;margin-left:46px;background:var(--surface);font-size:15px}
  .say::before{content:"";position:absolute;left:-11px;top:16px;width:16px;height:16px;background:var(--surface);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
  .say-who{position:absolute;left:-48px;top:6px;width:36px;height:36px;border-radius:50%;background:var(--orange-soft);color:var(--orange-deep);display:grid;place-items:center;font-size:12px;font-weight:700;line-height:1.1;text-align:center}
  .say small{display:block;color:var(--orange-deep);font-weight:700;font-size:12px;letter-spacing:.06em}
  .install{display:flex;gap:10px;align-items:stretch;border:2px dashed color-mix(in srgb,var(--line) 45%,transparent);border-radius:12px;padding:8px 8px 8px 12px;background:var(--paper)}
  .cmd{flex:1;min-width:0;font-family:var(--mono);font-size:13px;line-height:1.55;word-break:break-all;user-select:all;align-self:center}
  .copy{flex:none;font:inherit;font-weight:700;font-size:15px;color:#fff;background:var(--orange);border:2px solid var(--line);border-radius:10px;
    min-height:44px;padding:0 14px;cursor:pointer;display:flex;align-items:center;gap:6px;box-shadow:2px 2px 0 var(--line);transition:transform .1s,box-shadow .1s}
  .copy:hover{background:var(--orange-deep)} .copy:active{transform:translate(2px,2px);box-shadow:none}
  .copy.done{background:var(--leaf)}
  .copy svg{width:18px;height:18px}
  .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
  .gh{color:var(--green);font-weight:500;text-decoration:none;padding:4px 0}
  .gh:hover{text-decoration:underline}
  @media (max-width:480px){.install{flex-direction:column}.copy{justify-content:center}.say{margin-left:0;margin-top:40px}.say::before{left:22px;top:-10px;transform:rotate(135deg)}.say-who{left:6px;top:-44px}}

  /* 功能說明圖片 */
  .shot{position:relative;display:block;width:100%;padding:0;margin:0;border:2px solid var(--line);border-radius:12px;overflow:hidden;cursor:zoom-in;
    background:#fff;aspect-ratio:16/10}
  .shot img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block;transition:transform .25s}
  .shot:hover img{transform:scale(1.03)}
  .shot:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
  .shot-cap{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:22px 12px 8px;
    background:linear-gradient(transparent,rgba(20,20,18,.78));color:#fff;font-size:13px;text-align:left;line-height:1.4}
  .shot-n{flex:none;background:var(--orange);border-radius:999px;padding:2px 10px;font-weight:700;font-size:12px}
  .lb{position:fixed;inset:0;z-index:30;background:rgba(15,15,12,.88);display:flex;flex-direction:column;align-items:center;padding:16px;gap:10px}
  .lb-bar{width:100%;max-width:1100px;display:flex;justify-content:space-between;align-items:center;gap:10px;color:#fff}
  .lb-title{font-family:var(--font-hand);font-size:20px;font-weight:700}
  .lb-btn{font:inherit;font-weight:700;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:10px;min-width:44px;min-height:44px;cursor:pointer;padding:0 12px}
  .lb-btn:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
  .lb-stage{flex:1;min-height:0;width:100%;max-width:1100px;overflow:auto;border-radius:12px;background:#fff;-webkit-overflow-scrolling:touch}
  .lb-stage img{display:block;width:100%;height:auto}
  .lb-foot{width:100%;max-width:1100px;display:flex;justify-content:space-between;align-items:center;gap:10px;color:#fff;font-size:15px}
  .lb-cap{flex:1;text-align:center}
  footer{text-align:center;font-size:13px;color:var(--muted)}
  footer a{color:var(--green)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:10px;
    font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
  .toast.show{opacity:1}
  @media (prefers-reduced-motion:reduce){.toast,.tab,.copy{transition:none}}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <div>
      <div class="brand"><img src="logo.png" alt="特工365" title="特工365"><h1>特教老師的 AI <span class="hl">skills 裝備箱</span></h1></div>
    </div>
  </header>

  <section class="mission" aria-label="啟用三步驟">
    <span class="mission-tag">啟用三步驟</span>
    <ol>
      <li><div><b>複製安裝指令</b><p>在想用的卡片上按橘色「複製」。</p></div></li>
      <li><div><b>貼到你的 AI</b><p>Claude、ChatGPT、Gemini 都可以，貼上送出。</p></div></li>
      <li><div><b>照「這樣說」下指令</b><p>用卡片上的範例句開始，再換成你的內容。</p></div></li>
    </ol>
  </section>

  <section class="shelf">
    <div id="tabs" class="tabs" role="group" aria-label="依分類篩選"></div>
    <div id="board" class="board"></div>
  </section>

  <footer>由 <a href="https://github.com/sesns365" target="_blank" rel="noopener">特工365</a> 整理。每個 skill 的完整說明與下載都在各自的 GitHub 頁面。</footer>
</main>
<div id="lb" class="lb" role="dialog" aria-modal="true" aria-labelledby="lbTitle" hidden>
  <div class="lb-bar"><span id="lbTitle" class="lb-title"></span><button id="lbClose" class="lb-btn" type="button" aria-label="關閉">✕ 關閉</button></div>
  <div id="lbStage" class="lb-stage"><img id="lbImg" alt=""></div>
  <div class="lb-foot"><button id="lbPrev" class="lb-btn" type="button" aria-label="上一張">‹</button><span id="lbCap" class="lb-cap"></span><button id="lbNext" class="lb-btn" type="button" aria-label="下一張">›</button></div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="skills.js"></script>
<script>
(function(){
  var skills = (window.SKILLS || []).filter(function(s){return !s.hidden});
  var cat = "全部";
  var $ = function(id){return document.getElementById(id)};
  var TAB = {"全部":"var(--hl-yellow)","國語文":"var(--hl-blue)","數學":"var(--hl-green)","評量與報讀":"var(--hl-pink)","教材製作":"var(--orange-soft)"};
  var ICONS = {
    book:'<path d="M2 5.5C4 4.5 7 4.3 12 6.5c5-2.2 8-2 10-1v13c-2-1-5-1.2-10 1-5-2.2-8-2-10-1z"/><path d="M12 6.5v13"/>',
    pen:'<path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>',
    hanzi:'<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M12 3v18M3 12h18" stroke-dasharray="2 2.5"/>',
    zhuyin:'<path d="M5 6h8M9 6v12"/><path d="M17 5h3M17 10h3M17 15h3"/>',
    calc:'<rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 13h2M14 13h2M8 17h2M14 17h2"/>',
    speaker:'<path d="M4 10v4h4l5 4V6L8 10z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>',
    touch:'<path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V11"/><path d="M12 10.5a1.5 1.5 0 0 1 3 0v1a1.5 1.5 0 0 1 3 0v3.5a6 6 0 0 1-6 6h-.5a6 6 0 0 1-5-2.7L4 15a1.6 1.6 0 0 1 2.6-1.8L9 15"/>',
    map:'<path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/>',
    image:'<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/>'
  };
  var COPY_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg>';

  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function cmd(s){return "安裝這個 skill："+s.url}
  function toast(m){var t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove("show")},1800)}

  var cats=["全部","國語文","數學","評量與報讀","教材製作"];
  skills.forEach(function(s){if(s.cat&&cats.indexOf(s.cat)<0)cats.push(s.cat)});
  function n(c){return c==="全部"?skills.length:skills.filter(function(s){return s.cat===c}).length}
  $("tabs").innerHTML=cats.filter(function(c){return n(c)>0}).map(function(c){
    return '<button class="tab" type="button" style="--tab:'+(TAB[c]||"var(--hl-yellow)")+'" data-cat="'+esc(c)+'" aria-pressed="'+(c===cat)+'">'+esc(c)+'<span class="n">'+n(c)+'</span></button>'}).join("");
  $("tabs").addEventListener("click",function(e){var b=e.target.closest(".tab");if(!b)return;cat=b.dataset.cat;
    Array.prototype.forEach.call(this.children,function(x){x.setAttribute("aria-pressed",x.dataset.cat===cat)});render()});

  function render(){
    $("board").innerHTML=skills.filter(function(s){return cat==="全部"||s.cat===cat}).map(function(s){
      return '<article class="card" style="--c:'+esc(s.color||"#6ea548")+';--tab:'+(TAB[s.cat]||"var(--hl-yellow)")+'">'+
        '<div class="card-top"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(ICONS[s.icon]||ICONS.book)+'</svg></span>'+
        '<div><span class="label">'+esc(s.cat||"")+'</span><h2>'+esc(s.name)+'</h2></div></div>'+
        (s.shots&&s.shots.length?'<button class="shot" type="button" data-slug="'+esc(s.slug)+'" aria-label="看'+esc(s.name)+'的功能說明圖">'+
          '<img src="'+esc(s.shots[0].src)+'" alt="'+esc(s.shots[0].cap||"")+'" loading="lazy">'+
          '<span class="shot-cap"><span>'+esc(s.shots[0].cap||"")+'</span><span class="shot-n">看圖 '+s.shots.length+' 張</span></span></button>':'')+
        '<p class="summary">'+esc(s.summary)+'</p>'+
        (s.say?'<div class="say"><span class="say-who" aria-hidden="true">你</span><small>裝好後這樣說</small>「'+esc(s.say)+'」</div>':'')+
        '<div class="install"><div class="cmd">'+esc(cmd(s))+'</div>'+
        '<button class="copy" type="button" data-slug="'+esc(s.slug)+'">'+COPY_SVG+'<span>複製</span></button></div>'+
        '<div class="foot"><span>'+(s.updated?'更新 '+esc(s.updated):'')+'</span><a class="gh" href="'+esc(s.url)+'" target="_blank" rel="noopener">GitHub 說明與下載 ↗</a></div>'+
      '</article>'}).join("");
  }
  function fallback(text){var ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();
    var ok=false;try{ok=document.execCommand("copy")}catch(e){}document.body.removeChild(ta);return ok}
  $("board").addEventListener("click",function(e){
    var sh=e.target.closest(".shot");if(sh){openLb(sh.dataset.slug,sh);return}
    var b=e.target.closest(".copy");if(!b)return;
    var s=skills.filter(function(x){return x.slug===b.dataset.slug})[0];var text=cmd(s);
    var ok=function(){b.classList.add("done");b.querySelector("span").textContent="已複製";toast("已複製，貼到你的 AI 對話框");
      setTimeout(function(){b.classList.remove("done");b.querySelector("span").textContent="複製"},1800)};
    var no=function(){if(fallback(text))ok();else toast("請選取指令後按 Ctrl+C 複製")};
    try{navigator.clipboard.writeText(text).then(ok,no)}catch(err){no()}
  });
  var lb={s:null,i:0,from:null};
  function showLb(){var x=lb.s.shots[lb.i];$("lbImg").src=x.src;$("lbImg").alt=x.cap||"";$("lbStage").scrollTop=0;
    $("lbCap").textContent=(lb.s.shots.length>1?(lb.i+1)+" / "+lb.s.shots.length+"　":"")+(x.cap||"");
    $("lbPrev").hidden=$("lbNext").hidden=lb.s.shots.length<2}
  function openLb(slug,from){lb.s=skills.filter(function(x){return x.slug===slug})[0];lb.i=0;lb.from=from;
    $("lbTitle").textContent=lb.s.name;showLb();$("lb").hidden=false;document.body.style.overflow="hidden";$("lbClose").focus()}
  function closeLb(){$("lb").hidden=true;document.body.style.overflow="";if(lb.from)lb.from.focus()}
  function step(d){var n=lb.s.shots.length;lb.i=(lb.i+d+n)%n;showLb()}
  $("lbClose").onclick=closeLb;$("lbPrev").onclick=function(){step(-1)};$("lbNext").onclick=function(){step(1)};
  $("lb").addEventListener("click",function(e){if(e.target===this)closeLb()});
  document.addEventListener("keydown",function(e){if($("lb").hidden)return;
    if(e.key==="Escape")closeLb();else if(e.key==="ArrowLeft")step(-1);else if(e.key==="ArrowRight")step(1)});
  render();
})();
</script>
</body>
</html>
